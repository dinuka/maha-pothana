services:
  mongodb:
    image: mongo:latest
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  libretranslate:
    image: libretranslate/libretranslate:latest
    command: --disable-files-translation --disable-web-ui

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - nextjs
      - fastapi

  nextjs:
    build:
      context: ..
      dockerfile: infra/docker/nextjs.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - fastapi

  fastapi:
    build:
      context: ..
      dockerfile: infra/docker/fastapi.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - mongodb
      - redis
      - minio

  celery:
    build:
      context: ..
      dockerfile: infra/docker/fastapi.Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ../.env
    depends_on:
      - mongodb
      - redis
      - minio

volumes:
  mongodb_data:
  redis_data:
  minio_data:
